---
- name: Apply common role to all hosts
  hosts: all
  become: yes
  roles:
    - common

- name: Apply app role
  hosts: _app
  become: yes
  roles:
    - app

- name: Apply loadbalancer role
  hosts: _loadbalancer
  become: yes
  roles:
    - loadbalancer

- name: Apply monitoring role
  hosts: _monitoring
  become: yes
  roles:
    - monitoring