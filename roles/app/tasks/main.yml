---
- name: Install Python and pip
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present

- name: Create app directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'


- name: Copy application code
  ansible.builtin.copy:
    src: app.py
    dest: /opt/app/app.py
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Create virtualenv and install Flask
  ansible.builtin.pip:
    name: flask
    virtualenv: /opt/app/venv
    virtualenv_command: python3 -m venv

- name: Deploy systemd unit for the app
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/sre-app.service
    mode: '0644'

- name: Enable and start the app
  ansible.builtin.systemd:
    name: sre-app
    enabled: true
    state: started
    daemon_reload: true
