---
# --- Prometheus ---
- name: Create prometheus system group
  group:
    name: prometheus
    system: yes

- name: Create prometheus system user
  user:
    name: prometheus
    group: prometheus
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Create prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download and extract Prometheus
  unarchive:
    src: https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install prometheus binaries
  copy:
    src: "/tmp/prometheus-2.54.1.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0755'
    remote_src: yes
  loop:
    - prometheus
    - promtool

- name: Deploy prometheus.yml config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
  notify: restart prometheus

- name: Deploy prometheus systemd unit
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
  notify: restart prometheus

- name: Enable and start prometheus
  systemd:
    name: prometheus
    enabled: yes
    state: started
    daemon_reload: yes

- name: Deploy alert rules
  copy:
    src: alert_rules.yml
    dest: /etc/prometheus/alert_rules.yml
    owner: prometheus
    group: prometheus
  notify: restart prometheus

- name: Create alertmanager directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
  loop:
    - /etc/alertmanager
    - /var/lib/alertmanager

- name: Download and extract Alertmanager
  unarchive:
    src: https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install alertmanager binaries
  copy:
    src: "/tmp/alertmanager-0.27.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0755'
    remote_src: yes
  loop:
    - alertmanager
    - amtool

- name: Deploy alertmanager config
  template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: prometheus
    group: prometheus
  notify: restart alertmanager

- name: Deploy alertmanager systemd unit
  template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
  notify: restart alertmanager

- name: Enable and start alertmanager
  systemd:
    name: alertmanager
    enabled: yes
    state: started
    daemon_reload: yes

# --- Grafana ---
- name: Add Grafana APT key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: Add Grafana APT repo
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  apt:
    name: grafana
    state: present
    update_cache: yes

- name: Enable and start Grafana
  systemd:
    name: grafana-server
    enabled: yes
    state: started
- name: Deploy Grafana datasource provisioning
  template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
  notify: restart grafana

- name: Deploy Grafana dashboard provider config
  template:
    src: dashboard-provider.yml.j2
    dest: /etc/grafana/provisioning/dashboards/default.yml
  notify: restart grafana

- name: Create dashboards directory
  file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana

- name: Download node_exporter dashboard (ID 1860)
  get_url:
    url: https://grafana.com/api/dashboards/1860/revisions/37/download
    dest: /var/lib/grafana/dashboards/node-exporter.json
    owner: grafana
    group: grafana
  notify: restart grafana